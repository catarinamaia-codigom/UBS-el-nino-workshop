    const ids = todosIds(); const prox = (QZ_PUB || QZ).edicao + 1; let id = 'q' + prox + '_' + slug(t, 22), k = 2; while (ids.has(id)) id = 'q' + prox + '_' + slug(t, 18) + '_' + k++;
    const q = {id, tipo:tipo.value, texto:t, curto:t.slice(0, 60), desde:prox};
    if (q.tipo === 'unica' || q.tipo === 'multipla') q.opcoes = [{v:'sim', t:'Sim'}, {v:'nao', t:'Não'}];
    if (q.tipo === 'escala' || q.tipo === 'estrelas') q.ext = ['Pouco', 'Muito'];
    et.perguntas.push(q); S.editando = id; salvaRascunhoQz(); m.fechar(); render(true);
    setTimeout(() => { const el = [...document.querySelectorAll('.bq-edit')].pop(); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 60);
  });
}
function novaEtapa(){
  const nome = h('input', {type:'text', maxlength:'40', placeholder:'Ex.: Aprofundar'}), sub = h('input', {type:'text', maxlength:'120'});
  const ok = h('button', {class:'btn primary', type:'button'}, 'Criar etapa');
  const m = modal(h('div', null, h('h2', null, 'Nova etapa'), h('label', {class:'field'}, h('span', null, 'Nome'), nome), h('label', {class:'field'}, h('span', null, 'Subtítulo'), sub), h('div', {class:'btnrow'}, ok)));
  ok.addEventListener('click', () => { const n = nome.value.trim(); if (n.length < 3) return; const r = rascunho(); const ids = new Set(r.etapas.map(e => e.id)); let id = slug(n, 20), k = 2; while (ids.has(id)) id = slug(n, 16) + '_' + k++;
    r.etapas.push({id, num:r.etapas.length, nome:n, sub:sub.value.trim(), icone:'validar', intro:'', perguntas:[]}); salvaRascunhoQz(); m.fechar(); render(true); });
}
function preVisualizar(){
  S.qzAntesPreview = QZ; usarQuestionario(rascunho()); S.preview = true; S.resp = {}; S.anexos = {}; S.etapa = 0; S.erros = {}; S.view = 'form'; render();
}
function sairPreview(){ if (S.qzAntesPreview) usarQuestionario(S.qzAntesPreview); S.preview = false; S.qzAntesPreview = null; S.view = 'montagem'; render(); }
async function publicarRascunho(nota, btn){
  const r = rascunho();
  const vazias = r.etapas.filter(e => !e.perguntas.some(q => !q.arquivada));
  if (vazias.length && !confirm('A etapa “' + vazias[0].nome + '” não tem perguntas ativas e não aparecerá no formulário. Publicar mesmo assim?')) return;
  btn.disabled = true; btn.textContent = 'Publicando…';
  const enviar = {etapas:r.etapas.map(et => ({id:et.id, num:et.num, nome:et.nome, sub:et.sub || '', icone:et.icone || 'validar', intro:et.intro || '', perguntas:et.perguntas.map(q => { const c = clone(q); delete c.etapa; return c; })}))};
  try{
    let nova;
    if (demoAtivo()){ nova = {edicao:(QZ_PUB || QZ).edicao + 1, etapas:enviar.etapas}; LS.set('eln_demo_qz', nova); S.historico.unshift({edicao:nova.edicao, resumo:nota || 'Edição publicada (demonstração)', autor:S.sessao.nome, quando:new Date().toISOString()}); }
    else { const res = await api('publicar', {questionario:enviar, nota}); nova = res.questionario; S.historico = res.historico || S.historico; }
    QZ_PUB = normalizaQz(nova); usarQuestionario(nova); LS.set('eln_qz_cache', nova); LS.del('eln_rascunho_qz'); S.rascunho = null;
    toast('Edição ' + nova.edicao + ' publicada.'); render(true);
  }catch(e){ toast(String(e.message || e)); btn.disabled = false; btn.textContent = 'Publicar'; }
}
function verComentarios(alvo, titulo){
  const lista = comentariosDe(alvo);
  modal(h('div', null, h('span', {class:'eyebrow'}, 'Comentários de validação'), h('h2', {style:{fontSize:'22px'}}, titulo),
    h('div', {class:'clist'}, lista.map(c => h('div', {class:'citem' + (c.status === 'resolvido' ? ' res' : '')}, c.comentario, h('small', null, (c.autor || 'Sem nome') + ' · ' + dataBR(c.quando) + ' · edição ' + (c.edicao || '?'), h('span', {class:'st ' + (c.status || 'aberto')}, c.status || 'aberto')),
      h('div', {class:'btnrow', style:{marginTop:'6px'}}, c.status !== 'resolvido' ? h('button', {class:'btn sm', onclick:e => { mudaStatusComentario(c, 'resolvido'); e.currentTarget.closest('.modal').remove(); }}, icon('check'), 'Marcar como resolvido') : h('button', {class:'btn sm ghost', onclick:e => { mudaStatusComentario(c, 'aberto'); e.currentTarget.closest('.modal').remove(); }}, 'Reabrir')))))), {wide:true});
}
async function mudaStatusComentario(c, status){
  try{
    if (demoAtivo()){ const l = LS.get('eln_demo_coment', []); const x = l.find(y => y.id === c.id); if (x) x.status = status; LS.set('eln_demo_coment', l); S.coment.lista = l; }
    else { await api('comentario_status', {id:c.id, status}); c.status = status; }
    toast(status === 'resolvido' ? 'Comentário resolvido.' : 'Comentário reaberto.'); render(true);
  }catch(e){ toast(String(e.message || e)); }
}
function painelParametros(){
  const val = h('input', {type:'checkbox'}); val.checked = S.modoValidacao;
  const ab = h('input', {type:'checkbox'}); ab.checked = S.formAberto;
  const ubs = h('input', {type:'text', maxlength:'120', value:S.unidadeParam || ''});
  const usfs = h('textarea', {maxlength:'2000', value:S.usfs.join('\n'), style:{minHeight:'70px', fontSize:'13.5px'}, placeholder:'Uma USF por linha (sugestões no formulário)'});
  const btn = h('button', {class:'btn sm', type:'button'}, 'Salvar parâmetros');
  btn.addEventListener('click', async () => {
    const p = {modo_validacao:val.checked, form_aberto:ab.checked, ubs_padrao:ubs.value.trim(), usfs:usfs.value.split('\n').map(x => x.trim()).filter(Boolean)};
    btn.disabled = true;
    try{ if (demoAtivo()) LS.set('eln_demo_param', p); else await api('parametros_salvar', p);
      S.modoValidacao = p.modo_validacao; S.formAberto = p.form_aberto; S.usfs = p.usfs; S.unidadeParam = p.ubs_padrao; if (!S.unidadeFixa && p.ubs_padrao) S.unidade = p.ubs_padrao; toast('Parâmetros salvos.'); render(true); }
    catch(e){ toast(String(e.message || e)); btn.disabled = false; }
  });
  return h('div', {class:'panel'}, h('h3', null, 'Parâmetros'),
    h('label', {class:'switch'}, h('span', null, 'Versão DEMO para validação', h('br'), h('small', {class:'saving'}, 'mostra o balão de comentário a todos; respostas marcadas como validação')), val),
    h('label', {class:'switch'}, h('span', null, 'Formulário aberto'), ab),
    h('label', {class:'field'}, h('span', null, 'Nome padrão da unidade'), ubs),
    h('label', {class:'field'}, h('span', null, 'USFs sugeridas'), usfs), h('div', {class:'btnrow'}, btn));
}
async function carregaHistorico(){
  if (demoAtivo()) return;
  try{ const r = await api('historico', {}); S.historico = r.lista || []; if (S.view === 'montagem') render(true); }catch(e){}
}

/* ---------------------- TOOLTIP ---------------------- */
(function(){
  const tip = $('#tip');
  const show = (el, x, y) => {
    const raw = el.getAttribute('data-tip') || ''; const [v, ...rest] = raw.split('|');
    tip.replaceChildren(h('strong', null, v), rest.join('|'));
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    const px = Math.min(window.innerWidth - r.width - 8, Math.max(8, x - r.width / 2));
    const py = y - r.height - 12 < 8 ? y + 18 : y - r.height - 12;
    tip.style.left = px + 'px'; tip.style.top = py + 'px';
  };
  const alvo = e => e.target.closest && e.target.closest('[data-tip]');
  document.addEventListener('pointermove', e => { const el = alvo(e); if (el) show(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('pointerdown', e => { const el = alvo(e); if (el) show(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('focusin', e => { const el = alvo(e); if (el){ const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; }, {passive:true});
})();

/* ---------------------- RENDER E INÍCIO ---------------------- */
function render(manterScroll){
  const y = window.scrollY;
  let tela;
  switch (S.view){
    case 'form': tela = telaForm(); break;
    case 'enviado': tela = telaEnviado(); break;
    case 'painel': tela = telaPainel(); break;
    case 'topicos': tela = telaTopicos(false); break;
    case 'topicos_publico': tela = telaTopicos(true); break;
    case 'roteiro': tela = telaRoteiro(); break;
    case 'montagem': tela = telaMontagem(); break;
    case 'diag_publico': tela = telaDiagPublico(); break;
    default: tela = telaInicio();
  }
  if (S.preview && S.view === 'form') tela.prepend(h('div', {class:'valbar', style:{position:'sticky', top:'0', zIndex:'20', borderRadius:'0', margin:'0'}}, icon('olho'), h('span', {style:{flex:'1'}}, h('b', null, 'Pré-visualização do rascunho. '), 'Nada é enviado.'), h('button', {class:'btn sm', onclick:() => sairPreview()}, 'Voltar à montagem')));
  $('#app').replaceChildren(tela);
  const titulos = {painel:'Painel', topicos:'Tópicos do workshop', topicos_publico:'Tópicos: El Niño e saúde', roteiro:'Roteiro do Workshop', montagem:'Montagem', diag_publico:'Material Diagnóstico'};
  document.title = (titulos[S.view] || 'Escuta da USF') + ' · El Niño é pauta de saúde';
  if (manterScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
function rotaHash(){
  const v = (location.hash || '').replace('#', '');
  if (['painel', 'topicos', 'roteiro', 'montagem'].includes(v)) ir(v);
}
async function iniciar(){
  lerUnidadeDaUrl();
  let params; try{ params = new URLSearchParams(location.search); }catch(e){ params = new URLSearchParams(''); }
  if (params.get('diagnostico')) S.view = 'diag_publico';
  else if (params.get('topicos')) S.view = 'topicos_publico';
  if (demoAtivo() || !hasServer()){
    const qz = LS.get('eln_demo_qz', null); if (qz) usarQuestionario(qz);
    const p = LS.get('eln_demo_param', null); if (p){ S.modoValidacao = !!p.modo_validacao; S.formAberto = p.form_aberto !== false; S.usfs = p.usfs || []; S.unidadeParam = p.ubs_padrao || ''; if (!S.unidadeFixa && p.ubs_padrao) S.unidade = p.ubs_padrao; }
  }
  QZ_PUB = normalizaQz(QZ);
  render();
  window.addEventListener('hashchange', rotaHash);
  window.addEventListener('online', enviarPendentes);
  setInterval(() => { if (filaPendentes().length) enviarPendentes(); }, 30000);
  if (inAppsScript() && google.script.url) google.script.url.getLocation(loc => {
    const p = (loc && loc.parameter) || {};
    if (p.ubs || p.usf){ S.unidade = String(p.ubs || p.usf).slice(0, 120); S.unidadeFixa = true; }
    if (p.diagnostico){ S.view = 'diag_publico'; carregaDiagPublico(p.diagnostico); }
    else if (p.topicos){ S.view = 'topicos_publico'; carregaBanco(); }
    else if (p.painel != null) ir('painel');
    else render(true);
  });
  if (S.view === 'diag_publico') carregaDiagPublico(params.get('diagnostico'));
  if (S.view === 'topicos_publico') carregaBanco();
  if (hasServer()){
    try{
      const ping = await api('ping', {token:''});
      if (!S.unidadeFixa && ping.ubs_padrao) S.unidade = ping.ubs_padrao;
      S.unidadeParam = ping.ubs_padrao || ''; S.formAberto = ping.form_aberto !== false; S.modoValidacao = !!ping.modo_validacao; S.usfs = ping.usfs || []; S.urlApp = ping.url_app || '';
      if (ping.questionario && ping.questionario.etapas && !(S.sessao && S.sessao.demo)){ usarQuestionario(ping.questionario); LS.set('eln_qz_cache', ping.questionario); QZ_PUB = normalizaQz(QZ); }
      if (S.view === 'inicio') render(true);
    }catch(e){ /* sem conexão: o formulário segue funcionando e guarda no aparelho */ }
    enviarPendentes();
  }
  if (logado()) carregaComentarios(true).then(() => { if (S.view === 'montagem' || S.view === 'form') render(true); });
  rotaHash();
  if ('serviceWorker' in navigator && !inAppsScript() && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
async function carregaDiagPublico(id){
  if (!hasServer()){ S.publico = {erro:'Este link precisa do servidor conectado.'}; render(true); return; }
  try{ const r = await api('diagnostico', {id, token:''}); S.publico = {conteudo:r.conteudo}; await carregaBanco(); }
  catch(e){ S.publico = {erro:'Não encontramos este material. Confira o link com a coordenação.'}; }
  render(true);
}
iniciar();
