<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Niño é pauta de saúde · Escuta da UBS</title>
<meta name="description" content="Formulário anônimo de escuta da equipe da UBS e painel que organiza o workshop de cocriação sobre calor, El Niño e saúde. UBS conhece. A UPE apoia.">
<meta name="theme-color" content="#8b0c11">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f5f4; --card:#ffffff; --ink:#221f1f; --ink2:#5c5555; --muted:#7f7676;
  --line:#e8e0df; --line2:#f2eded;
  --red:#a4161d; --red-deep:#8b0c11; --red-dark:#6e0a0e; --red-hi:#c0242c;
  --rose:#f7ecec; --rose2:#efdede; --rose3:#e6caca;
  --blue:#2b6c9e;
  --l1:#8b0c11; --l2:#df979b; --l3:#dcd7d5; --l4:#97b3c8; --l5:#1f4f72;
  --bar-dim:#dcbcbe;
  --serif:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --sans:'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --shadow:0 12px 34px rgba(110,10,14,.07), 0 2px 6px rgba(34,31,31,.05);
  --shadow-sm:0 4px 14px rgba(110,10,14,.06);
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid #2b6c9e;outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative}
.narrow{max-width:760px}

/* ---------- identidade ---------- */
.eyebrow{display:block;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.display{font-family:var(--serif);font-weight:400;text-transform:uppercase;line-height:1.02;letter-spacing:.005em;margin:0;color:var(--ink);text-shadow:0 2px 3px rgba(0,0,0,.10)}
.display em{font-style:normal;color:var(--red)}
.rule{display:block;width:54px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--red-deep),var(--red-hi));margin:14px 0 0}
.punch{font-style:italic;font-weight:800;color:var(--red)}
.serif{font-family:var(--serif);font-weight:400}
.lead{font-size:17px;color:var(--ink2);max-width:620px}
.ribbon{position:absolute;top:0;right:0;width:min(260px,34vw);height:min(170px,22vw);background:linear-gradient(200deg,#c0242c 0%,#8b0c11 55%,#5e080b 100%);border-bottom-left-radius:100% 100%;pointer-events:none;z-index:0;box-shadow:-8px 10px 30px rgba(110,10,14,.18)}
.ribbon.sm{width:min(170px,30vw);height:min(110px,20vw)}
.skyline{position:absolute;right:0;bottom:0;width:min(520px,70%);opacity:.9;pointer-events:none;z-index:0;filter:grayscale(1) contrast(.95)}
.notebar{display:flex;gap:12px;align-items:center;border-left:3px solid var(--red);padding:2px 0 2px 12px;font-style:italic;font-weight:700;color:var(--red);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2)}
.chip svg{width:16px;height:16px;color:var(--red)}
.pill{display:inline-block;background:linear-gradient(90deg,var(--red-deep),#b81c24 70%,#c0242c);color:#fff;border-radius:16px 30px 30px 16px;padding:10px 26px 11px 22px;box-shadow:0 8px 18px rgba(139,12,17,.22);transform:skewX(-6deg)}
.pill>span{display:block;transform:skewX(6deg);font-style:italic;line-height:1.2}
.pill small{display:block;font-size:13px;opacity:.92;font-weight:500}
.pill b{font-size:16px;font-weight:800}
.ico{display:inline-grid;place-items:center;width:58px;height:58px;color:var(--red);background:var(--rose);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.ico svg{width:28px;height:28px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .12s ease,box-shadow .12s ease,background .12s}
.btn:hover{box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(90deg,var(--red-deep),var(--red-hi));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(139,12,17,.25)}
.btn.primary:hover{box-shadow:0 10px 26px rgba(139,12,17,.33)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--red)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--red);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- topo ---------- */
.topbar .chip{max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block}
.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;line-height:1.1}
.brand b{color:var(--red);font-weight:400}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--rose)}

/* ---------- início ---------- */
.hero{position:relative;overflow:hidden;padding-bottom:36px}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.25fr .75fr;gap:36px;align-items:center;padding:26px 0 10px}
.hero h1{font-size:clamp(38px,6.2vw,74px)}
.hero h1 em{display:block}
.hero .tag{margin:22px 0 6px;font-family:var(--serif);font-size:clamp(24px,3vw,32px)}
.hero .tag em{font-style:normal;color:var(--red)}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 26px}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.mapcard{position:relative;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:22px 22px 48px;max-width:330px;justify-self:end}
.mapcard img{width:100%;max-width:220px;margin:0 auto}
.mapcard .cap{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink2);margin-top:8px}
.mapcard .leg{display:flex;flex-direction:column;gap:3px;margin-top:8px;font-size:12px;color:var(--ink2)}
.mapcard .leg i{display:inline-block;width:12px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
.bubble{position:absolute;left:-46px;bottom:-30px;background:linear-gradient(100deg,#123d73,#1d5aa3);color:#fff;border-radius:14px;padding:12px 18px;transform:rotate(-6deg);box-shadow:0 10px 24px rgba(18,61,115,.28);font-style:italic;font-weight:600;line-height:1.25;font-size:15px}
.bubble b{font-weight:800}
.alert-line{margin-top:22px}

.block{position:relative;padding:54px 0;overflow:hidden}
.block h2.display{font-size:clamp(30px,4.2vw,48px)}
.block .sub{font-family:var(--serif);font-size:clamp(20px,2.4vw,26px);margin:12px 0 0}
.block .sub em{font-style:normal;color:var(--red)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px;position:relative;z-index:1}
.stepcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 16px 18px;text-align:center;box-shadow:var(--shadow-sm);position:relative}
.stepcard h3{font-family:var(--serif);font-weight:400;color:var(--red);font-size:22px;margin:10px 0 0}
.stepcard .rule{margin:8px auto 10px;width:30px;height:2px}
.stepcard p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
.stepcard+.stepcard::before{content:'›';position:absolute;left:-14px;top:50%;transform:translateY(-50%);color:var(--red);font-size:28px;font-weight:700}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:28px;position:relative;z-index:1}
.journey .j{text-align:center;position:relative;padding:6px 6px 0}
.journey .j svg{width:42px;height:42px;color:var(--red)}
.journey .j h4{font-family:var(--serif);font-weight:400;color:var(--red);font-size:24px;margin:8px 0 2px;letter-spacing:.02em}
.journey .j p{margin:0;font-size:14px;color:var(--ink2)}
.journey .j.here{background:var(--rose);border-radius:16px;padding:12px 8px 12px}
.journey .j.here::after{content:'você está aqui';position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.journey .j+.j::before{content:'';position:absolute;left:-10px;top:30px;width:20px;height:2px;background:var(--red);opacity:.6}
.formula{display:inline-flex;align-items:center;gap:12px;margin-top:26px;background:var(--rose);border-radius:14px;padding:12px 20px;font-style:italic;font-weight:800;color:var(--red);font-size:17px}
.formula svg{width:24px;height:24px}
.privacy{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px;position:relative;z-index:1}
.privacy .p{background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line)}
.privacy .p b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;color:var(--red);margin-bottom:4px}
.privacy .p span{font-size:14px;color:var(--ink2)}
.footer{position:relative;overflow:hidden;padding:46px 0 150px;margin-top:10px;border-top:1px solid var(--line)}
.footer .wrap{z-index:1}
.footer .sign{font-family:var(--serif);font-size:28px;margin:0}
.footer .sign em{font-style:normal;color:var(--red)}
.footer small{display:block;color:var(--muted);margin-top:8px;font-size:13px}

/* ---------- formulário ---------- */
.formpage{position:relative;min-height:100vh;overflow:hidden;padding-bottom:140px}
.stepper{display:flex;gap:6px;margin:4px 0 22px;position:relative;z-index:2}
.stepper .s{flex:1;min-width:0}
.stepper .bar{height:6px;border-radius:6px;background:var(--rose2);overflow:hidden}
.stepper .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red-deep),var(--red-hi));border-radius:6px;transition:width .3s ease}
.stepper .s.ok .bar i{width:100%}
.stepper .s.cur .bar i{width:50%}
.stepper .lbl{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper .s.cur .lbl,.stepper .s.ok .lbl{color:var(--red)}
.stepper-now{display:none;font-size:12.5px;font-weight:700;color:var(--red);margin:-14px 0 18px}
.clip{position:relative;z-index:2;background:#fffdfd;border:2px solid #b3262d;border-radius:24px;padding:40px 28px 26px;box-shadow:var(--shadow);margin-top:26px}
.clip::before{content:'';position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:150px;height:30px;border-radius:12px 12px 8px 8px;background:linear-gradient(180deg,#c0242c,#7d0b10);box-shadow:0 6px 12px rgba(125,11,16,.25)}
.clip::after{content:'';position:absolute;top:-31px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;border:6px solid #a4161d;background:#fffdfd}
.stephead{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.stephead h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,36px);color:var(--red);margin:0;line-height:1.05}
.stephead p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.intro{background:var(--rose);border-radius:14px;padding:12px 16px;font-size:14.5px;color:var(--ink2);margin:14px 0 6px}
.intro b{color:var(--ink)}
.q{border:0;margin:0;padding:22px 0 20px;border-top:1px solid var(--line2);min-width:0}
.q:first-of-type{border-top:0}
.q legend{padding:0;font-weight:700;font-size:17px;line-height:1.4;margin-bottom:4px;float:left;width:100%}
.q legend+*{clear:both}
.q .n{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:8px;background:var(--rose);color:var(--red);font-size:13px;font-weight:800;margin-right:8px;vertical-align:1px}
.q .help{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.q .req{color:var(--red);font-weight:800}
.q.err{background:linear-gradient(90deg,rgba(164,22,29,.06),transparent 70%);border-radius:10px;padding-left:10px;margin-left:-10px}
.q .errmsg{color:var(--red);font-size:13.5px;font-weight:700;margin-top:8px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.scale label{position:relative;cursor:pointer}
.scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.scale span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:20px;transition:all .12s}
.scale span small{font-size:10.5px;font-weight:600;color:var(--muted);line-height:1.1;text-align:center;padding:0 2px}
.scale label:hover span{border-color:var(--rose3);background:var(--rose)}
.scale input:checked+span{background:linear-gradient(160deg,var(--red-hi),var(--red-deep));color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(139,12,17,.25)}
.scale input:checked+span small{color:#fde7e7}
.scale input:focus-visible+span{outline:3px solid #2b6c9e;outline-offset:2px}
.scale-ends{display:none;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.opts{display:grid;gap:8px;margin-top:10px}
.opts.cols{grid-template-columns:1fr 1fr}
.opt{position:relative;display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;line-height:1.35;font-size:15.5px;transition:all .12s}
.opt:hover{border-color:var(--rose3);background:#fffafa}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .box{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid #b3262d;background:#fff;display:grid;place-items:center;margin-top:-1px;transition:all .12s}
.opt.radio .box{border-radius:50%}
.opt .box svg{width:14px;height:14px;color:#fff;opacity:0}
.opt.on{border-color:var(--red);background:var(--rose)}
.opt.on .box{background:var(--red);border-color:var(--red)}
.opt.on .box svg{opacity:1}
.opt.off{opacity:.45;cursor:not-allowed}
.opt:has(input:focus-visible){outline:3px solid #2b6c9e;outline-offset:2px}
.counter{font-size:12.5px;font-weight:700;color:var(--red);margin-top:8px}
.outro{margin-top:8px}
input[type=text],textarea,select,input[type=password],input[type=url]{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;font-size:15.5px;outline:none;transition:border .12s}
input[type=text]:focus,textarea:focus,select:focus,input[type=password]:focus,input[type=url]:focus{border-color:var(--red)}
textarea{min-height:104px;resize:vertical;line-height:1.45}
.charcount{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
.navbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}
.saving{font-size:12.5px;color:var(--muted)}
.banner{position:relative;z-index:2;border-radius:14px;padding:12px 16px;font-size:14px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start}
.banner.demo{background:#fff6e5;border:1px solid #f0d49b;color:#5f4300}
.banner.info{background:#eef4f9;border:1px solid #cfe0ee;color:#1e4566}
.banner.warn{background:var(--rose);border:1px solid var(--rose3);color:var(--red-dark)}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px}
.done{text-align:center;padding:30px 10px 10px}
.done h2{font-size:clamp(30px,5vw,44px)}
.done p{color:var(--ink2);max-width:520px;margin:14px auto}
.check-big{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--red-hi),var(--red-deep));color:#fff;box-shadow:0 12px 26px rgba(139,12,17,.3)}
.check-big svg{width:38px;height:38px}

/* ---------- login ---------- */
.loginbox{position:relative;z-index:2;max-width:460px;margin:40px auto 0;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:30px 28px}
.loginbox h2{font-family:var(--serif);font-weight:400;font-size:32px;margin:6px 0 4px}
.loginbox label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
.loginbox details{margin-top:18px;font-size:14px;color:var(--ink2)}
.loginbox details summary{cursor:pointer;font-weight:700;color:var(--ink)}
.formerr{color:var(--red);font-weight:700;font-size:14px;margin-top:10px;min-height:20px}

/* ---------- painel ---------- */
.dash{position:relative;padding-bottom:150px;overflow:hidden}
.dash-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:10px 0 18px}
.dash-head h1{font-size:clamp(32px,4.6vw,52px)}
.dash-head p{margin:10px 0 0;color:var(--ink2);max-width:640px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seqnav{position:sticky;top:0;z-index:5;background:rgba(247,245,244,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -22px;padding:10px 22px}
.seqnav .in{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.seqnav a{flex:none;display:inline-flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-weight:700;font-size:13.5px;padding:7px 13px 7px 8px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.seqnav a i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:12px}
.seqnav a.star{background:linear-gradient(90deg,var(--red-deep),var(--red-hi));color:#fff;border-color:transparent}
.seqnav a.star i{background:#fff;color:var(--red)}
.filters{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:18px 0 6px}
.filters label{display:grid;gap:5px;font-size:11.5px;font-weight:700;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase;min-width:170px;flex:1}
.filters select{height:42px;padding:8px 12px;font-size:14px;text-transform:none;letter-spacing:0}
.filters .note{flex-basis:100%;margin:0;font-size:12.5px;color:var(--muted)}
.kpis{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;border-top:3px solid var(--red)}
.stat:nth-child(2){border-top-color:var(--l2)}
.stat:nth-child(3){border-top-color:var(--l4)}
.stat:nth-child(4){border-top-color:var(--l5)}
.stat .lbl{font-size:13px;color:var(--ink2);font-weight:600;line-height:1.35;min-height:35px}
.stat .val{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.stat .val small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.sec{position:relative;z-index:1;padding-top:40px;scroll-margin-top:60px}
.sec-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.sec-head .num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--red-hi),var(--red-deep));color:#fff;font-family:var(--serif);font-size:22px;box-shadow:0 6px 14px rgba(139,12,17,.22)}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,34px);margin:2px 0 0;line-height:1.08}
.sec-head h2 em{font-style:normal;color:var(--red)}
.sec-head p{margin:6px 0 0;color:var(--ink2);font-size:14.5px;max-width:760px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0}
.card.full{grid-column:1/-1}
.card h3{font-size:15.5px;line-height:1.4;margin:0}
.card .desc{font-size:12.5px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.card details.tbl{margin-top:12px;border-top:1px solid var(--line2);padding-top:8px;font-size:13px}
.card details.tbl summary{cursor:pointer;font-weight:700;color:var(--ink2);font-size:12.5px}
table.t{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 4px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend i.dot{border-radius:50%;width:11px;height:11px}
/* likert */
.lk{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(0,2.4fr) 92px;gap:6px 14px;align-items:center;margin-top:12px}
.lk .ql{font-size:13.5px;font-weight:600;line-height:1.35}
.lk .ql small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.seg{display:flex;gap:2px;height:28px;border-radius:5px;overflow:hidden;min-width:0}
.seg b{display:flex;align-items:center;justify-content:flex-start;padding-left:6px;font-size:11.5px;font-weight:700;min-width:0;white-space:nowrap;cursor:default;border-radius:4px}
.seg b:hover,.seg b:focus{filter:brightness(1.07)}
.lk .pct{text-align:right;line-height:1.15}
.lk .pct strong{font-size:18px;font-weight:700}
.lk .pct small{display:block;font-size:11px;color:var(--muted)}
/* barras */
.bars{display:grid;gap:9px;margin-top:14px}
.br{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:center}
.br .lab{font-size:13.5px;line-height:1.3;min-width:0}
.br .trk{position:relative;height:16px;display:flex;align-items:center}
.br .fill{height:14px;background:var(--red);border-radius:0 4px 4px 0;min-width:2px;cursor:default}
.br .fill.dim{background:var(--bar-dim)}
.br .fill:hover,.br .fill:focus{filter:brightness(1.08)}
.br .v{margin-left:8px;font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.br .v small{font-weight:500;color:var(--muted)}
.br.top .lab{font-weight:700}
.base{font-size:11.5px;color:var(--muted);margin-top:10px}
/* halteres */
.db{margin-top:12px}
.db-axis{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.2fr) 84px;gap:14px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.db-axis .ticks{position:relative;height:16px}
.db-axis .ticks span{position:absolute;transform:translateX(-50%)}
.db-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.2fr) 84px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.db-row .ql{font-size:13.5px;font-weight:700;line-height:1.3}
.db-row .ql small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px}
.db-track{position:relative;height:30px;background:linear-gradient(90deg,var(--line2) 1px,transparent 1px) 0 0/25% 100%}
.db-track::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--line2)}
.db-line{position:absolute;top:50%;height:2px;background:#bfb3b3;transform:translateY(-50%)}
.db-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff;cursor:default}
.db-dot::before{content:'';position:absolute;inset:-6px;border-radius:50%}
.db-dot.g{background:var(--blue)}
.db-dot.l{background:var(--red)}
.db-dot:focus{outline:3px solid #2b6c9e;outline-offset:3px}
.db-row .gap{text-align:right;line-height:1.15}
.db-row .gap strong{font-size:17px}
.db-row .gap small{display:block;font-size:11px;color:var(--muted)}
/* textos */
.quotes{display:grid;gap:10px;margin-top:12px;max-height:420px;overflow:auto;padding-right:4px}
.quote{background:var(--rose);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;border-left:3px solid var(--red)}
.quote small{display:block;margin-top:6px;color:var(--muted);font-size:11.5px}
.empty{font-size:13.5px;color:var(--muted);padding:14px 0}
.anon{background:#fff;border:1px dashed var(--rose3);border-radius:16px;padding:26px;text-align:center;color:var(--ink2);margin-top:18px}
/* roteiro */
.roteiro{position:relative;background:#fff;border-radius:24px;border:2px solid #b3262d;padding:28px 26px 22px;box-shadow:var(--shadow);overflow:hidden}
.roteiro .ribbon{width:150px;height:96px}
.roteiro-head{position:relative;z-index:1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;padding-right:110px}
.roteiro-head h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:4px 0 0;line-height:1.05}
.roteiro-head h3 em{font-style:normal;color:var(--red)}
.mom{position:relative;z-index:1;display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:20px 0;border-top:1px solid var(--line2)}
.mom:first-of-type{border-top:0}
.mom .when{text-align:center}
.mom .when b{display:grid;place-items:center;width:52px;height:52px;margin:0 auto;border-radius:50%;background:var(--rose);color:var(--red);font-family:var(--serif);font-size:24px;font-weight:400}
.mom .when span{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-top:6px}
.mom h4{margin:0;font-family:var(--serif);font-weight:400;font-size:23px;color:var(--red)}
.mom h4 small{font-family:var(--sans);font-size:13px;color:var(--ink2);font-weight:600;margin-left:6px}
.mom .why{font-size:13.5px;color:var(--ink2);margin:4px 0 10px}
.mom ul{margin:0;padding-left:18px}
.mom li{margin:5px 0;font-size:14.5px}
.mom li small{color:var(--muted);font-size:12.5px}
.rank{display:grid;gap:8px;margin:6px 0 0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;margin:0;background:var(--paper);border-radius:12px;padding:10px 12px}
.rank li>i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--red);color:#fff;font-weight:800;font-size:13px}
.rank li b{display:block;font-size:14.5px}
.rank li span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.folder{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.fsec{border:1px solid var(--rose3);border-radius:14px;padding:12px 14px;background:#fffafa}
.fsec h5{margin:0;font-size:14.5px;display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.fsec h5 i{font-style:normal;flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--red);color:#fff;font-size:12px;font-weight:800;margin-top:-1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--rose3);color:var(--red-dark);border-radius:999px;padding:4px 10px}
.fsec .ask{font-size:12.5px;color:var(--ink2);margin-top:8px;font-style:italic}
.deliver{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:6px}
.deliver .d{background:var(--paper);border-radius:12px;padding:12px;font-size:13px}
.deliver .d b{display:block;font-family:var(--serif);font-weight:400;font-size:18px;color:var(--red);line-height:1.15;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;transition:all .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#tip{position:fixed;z-index:60;pointer-events:none;background:#221f1f;color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.35;max-width:260px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#tip strong{display:block;font-size:15px}
.loading{opacity:.5;transition:opacity .2s}
.apresentar-sair{position:fixed;right:16px;bottom:16px;z-index:40}

/* modo apresentação (projetar no workshop) */
body.apresentacao .no-present{display:none!important}
body.apresentacao .dash{font-size:17px}
body.apresentacao .card h3{font-size:17px}
body.apresentacao .lk .ql,body.apresentacao .br .lab{font-size:15px}
body:not(.apresentacao) .apresentar-sair{display:none}

@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .mapcard{justify-self:start;max-width:300px;margin-left:46px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
  .deliver{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .seqnav{margin:0 -16px;padding:10px 16px}
  .steps4,.journey,.privacy{grid-template-columns:1fr 1fr}
  .stepcard+.stepcard::before,.journey .j+.j::before{display:none}
  .grid2,.grid3,.folder{grid-template-columns:1fr}
  .clip{padding:36px 16px 20px;border-radius:20px}
  .opts.cols{grid-template-columns:1fr}
  .lk{grid-template-columns:1fr 64px}
  .lk .ql{grid-column:1/-1;margin-top:6px}
  .db-axis,.db-row{grid-template-columns:minmax(0,1fr) 64px}
  .db-axis>span:first-child,.db-row .ql{grid-column:1/-1}
  .db-axis>span:last-child{display:none}
  .br{grid-template-columns:1fr}
  .br .lab{margin-bottom:-4px}
  .roteiro{padding:24px 16px 18px}
  .roteiro-head{padding-right:60px}
  .mom{grid-template-columns:1fr}
  .mom .when{display:flex;gap:10px;align-items:center;text-align:left}
  .mom .when b{margin:0;width:40px;height:40px;font-size:19px}
  .mom .when span{margin:0}
  .stat .val{font-size:32px}
  .scale{gap:5px}
  .scale span{min-height:54px;font-size:18px;border-radius:12px}
  .scale span small{display:none}
  .scale-ends{display:flex}
  .stepper .lbl{display:none}
  .stepper-now{display:block}
  .bubble{left:-30px;font-size:13.5px}
}
@media (max-width:420px){
  .steps4,.journey,.privacy{grid-template-columns:1fr}
  .stat{padding:14px}
  .stat .val{font-size:28px}
  .stat .lbl{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  body{background:#fff}
  .no-print,.seqnav,.toolbar,.filters,.topbar .btn,.apresentar-sair,.skyline{display:none!important}
  .card,.roteiro,.stat{break-inside:avoid;box-shadow:none}
  .quotes{max-height:none;overflow:visible}
  .dash{padding-bottom:0}
}
@media (forced-colors:active){.seg b,.br .fill,.db-dot{forced-color-adjust:none}}
</style>

function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'trusted') el.innerHTML = v;            /* somente textos fixos deste arquivo */
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const inAppsScript = () => typeof google !== 'undefined' && google.script && google.script.run;
const apiUrl = () => String(API_URL || LS.get('eln_api_url', '') || '').trim();
const hasServer = () => !!(inAppsScript() || apiUrl());
function api(op, data){
  const req = Object.assign({op}, data || {});
  if (inAppsScript()) return new Promise((res, rej) => google.script.run
    .withSuccessHandler(r => r && r.ok ? res(r.data) : rej(new Error((r && r.error) || 'Erro no servidor.')))
    .withFailureHandler(e => rej(e instanceof Error ? e : new Error(String(e))))
    .elninoApi(req));
  const url = apiUrl();
  if (!url) return Promise.reject(new Error('Servidor não configurado.'));
  return fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(req), redirect:'follow'})
    .then(r => { if (!r.ok) throw new Error('O servidor respondeu ' + r.status + '.'); return r.json(); })
    .then(r => { if (!r || !r.ok) throw new Error((r && r.error) || 'Erro no servidor.'); return r.data; });
}

function visivel(q){
  if (!q.se) return true;
  const v = S.resp[q.se.q];
  if (Array.isArray(v)) return v.some(x => q.se.em.includes(x));
  return q.se.em.includes(v);
}
function respondida(q){
  const v = S.resp[q.id];
  if (Array.isArray(v)) return v.length > 0;
  return v !== undefined && v !== null && String(v).trim() !== '';
}
function validaEtapa(i){
  const erros = {};
  ETAPAS[i].perguntas.forEach(q => { if (visivel(q) && q.obrig && !respondida(q)) erros[q.id] = q.tipo === 'multipla' ? 'Marque pelo menos uma opção.' : 'Esta pergunta é obrigatória.'; });

}
function respostasLimpa(){
  const out = {};
  QS.forEach(q => {
    if (!visivel(q) || !respondida(q)) return;
    const v = S.resp[q.id];
    if (q.tipo === 'multipla') out[q.id] = v.slice(0, 20);
    else if (q.tipo === 'escala') out[q.id] = Number(v);
    else out[q.id] = String(v).trim().slice(0, 1500);

    const ot = String(S.resp[q.id + '_outro'] || '').trim();

  });
  return out;
}

function campoPergunta(q, n){
  const erro = S.erros[q.id];
  const fs = h('fieldset', {class:'q' + (erro ? ' err' : ''), id:'q-' + q.id});
  fs.append(h('legend', null, h('span', {class:'n'}, n), q.texto, q.obrig ? h('span', {class:'req', 'aria-hidden':'true'}, ' *') : null));
  if (q.ajuda) fs.append(h('p', {class:'help'}, q.ajuda));
  const onChange = () => { delete S.erros[q.id]; salvaRascunho(); };

  if (q.tipo === 'escala'){
    const grid = h('div', {class:'scale'});
    const rot = ['', q.ext[0], '', 'Mais ou menos', '', q.ext[1]];
    for (let v = 1; v <= 5; v++){
      const inp = h('input', {type:'radio', name:q.id, value:String(v), 'aria-label':v + (rot[v] ? ' – ' + rot[v] : '')});
      if (Number(S.resp[q.id]) === v) inp.checked = true;
      inp.addEventListener('change', () => { S.resp[q.id] = v; fs.classList.remove('err'); const em = fs.querySelector('.errmsg'); if (em) em.remove(); onChange(); });
      grid.append(h('label', null, inp, h('span', null, String(v), rot[v] && (v === 1 || v === 5) ? h('small', null, rot[v]) : null)));
    }
    fs.append(grid, h('div', {class:'scale-ends', 'aria-hidden':'true'}, h('span', null, '1 · ' + q.ext[0]), h('span', null, q.ext[1] + ' · 5')));
  }
  else if (q.tipo === 'unica' || q.tipo === 'multipla'){
    const multi = q.tipo === 'multipla';
    const box = h('div', {class:'opts' + (q.cols ? ' cols' : '')});
    const counter = multi && q.max ? h('div', {class:'counter', 'aria-live':'polite'}) : null;
    const outroInp = h('input', {type:'text', class:'outro', maxlength:'200', placeholder:'Qual? (opcional)', 'aria-label':'Especifique a opção “outro”', value:S.resp[q.id + '_outro'] || ''});
    outroInp.addEventListener('input', () => { S.resp[q.id + '_outro'] = outroInp.value; salvaRascunho(); });
    const labels = [];
    const sync = () => {
      const val = S.resp[q.id];
      const sel = multi ? (val || []) : (val ? [val] : []);
      const cheio = multi && q.max && sel.length >= q.max;
      labels.forEach(({lab, inp, v}) => {
        const on = sel.includes(v);
        inp.checked = on; lab.classList.toggle('on', on);
        const off = cheio && !on; lab.classList.toggle('off', !!off); inp.disabled = !!off;
      });
      if (counter) counter.textContent = sel.length + ' de ' + q.max + ' escolhidas' + (cheio ? ' — desmarque uma para trocar' : '');
      const temOutro = sel.includes('outro') || sel.includes('outra');
      outroInp.style.display = temOutro ? '' : 'none';
    };
    q.opcoes.forEach(o => {
      const inp = h('input', {type:multi ? 'checkbox' : 'radio', name:q.id, value:o.v});
      const lab = h('label', {class:'opt' + (multi ? '' : ' radio')}, inp, h('span', {class:'box'}, icon('check')), h('span', null, o.t));
      inp.addEventListener('change', () => {
        if (multi){
          let arr = (S.resp[q.id] || []).slice();
          if (inp.checked){
            if (q.exclusiva && o.v === q.exclusiva) arr = [o.v];
            else { arr = arr.filter(x => x !== q.exclusiva); if (!arr.includes(o.v)) arr.push(o.v); }
          } else arr = arr.filter(x => x !== o.v);
          S.resp[q.id] = arr;
        } else {
          S.resp[q.id] = o.v;
          /* perguntas condicionais dependem desta: redesenha a etapa */
          if (QS.some(x => x.se && x.se.q === q.id)){ onChange(); render(true); return; }
        }
        fs.classList.remove('err'); const em = fs.querySelector('.errmsg'); if (em) em.remove();
        sync(); onChange();
      });
      labels.push({lab, inp, v:o.v}); box.append(lab);
    });
    fs.append(box);
    if (q.opcoes.some(o => o.v === 'outro' || o.v === 'outra')) fs.append(outroInp);
    if (counter) fs.append(counter);
    sync();
  }
  else if (q.tipo === 'texto'){
    const ta = h('textarea', {name:q.id, maxlength:'800', 'aria-label':q.texto, placeholder:'Escreva aqui…'});
    ta.value = S.resp[q.id] || '';
    const cc = h('div', {class:'charcount'}, (ta.value.length) + '/800');
    ta.addEventListener('input', () => { S.resp[q.id] = ta.value; cc.textContent = ta.value.length + '/800'; salvaRascunho(); });
    fs.append(ta, cc);
  }
  if (erro) fs.append(h('div', {class:'errmsg', role:'alert'}, erro));
  return fs;
}

function normaliza(r){
  const o = Object.assign({}, r);
  QS.forEach(q => {
    const v = o[q.id];
    if (q.tipo === 'multipla') o[q.id] = Array.isArray(v) ? v : String(v == null ? '' : v).split('|').map(x => x.trim()).filter(Boolean);
    else if (q.tipo === 'escala'){ const n = Number(v); o[q.id] = v === '' || v == null || !Number.isFinite(n) || n < 1 || n > 5 ? null : n; }
    else o[q.id] = v == null ? '' : String(v);
  });
  o.unidade = String(o.unidade || '').trim() || UBS_PADRAO;
  return o;
}
function filtra(rows){
  const f = S.painel.filtros;
  return rows.filter(r => (f.unidade === 'all' || r.unidade === f.unidade) && (f.funcao === 'all' || r.funcao === f.funcao) && (f.tempo === 'all' || r.tempo === f.tempo));
}
function distribuicao(rows, qid){
  const q = Q[qid]; const base = rows.filter(r => q.tipo === 'multipla' ? r[qid].length : r[qid] !== '' && r[qid] != null);
  const cont = {}; q.opcoes.forEach(o => cont[o.v] = 0);
  base.forEach(r => (q.tipo === 'multipla' ? r[qid] : [r[qid]]).forEach(v => { if (v in cont) cont[v]++; else cont[v] = (cont[v] || 0) + 1; }));
  const itens = Object.keys(cont).map(v => ({v, t:optLabel(qid, v), n:cont[v], p:pct(cont[v], base.length)}));
  return {n:base.length, itens};
}
function likert(rows, qid){
  const vals = rows.map(r => r[qid]).filter(v => v != null);
  const c = [0, 0, 0, 0, 0, 0]; vals.forEach(v => c[v]++);
  const n = vals.length; const alta = c[4] + c[5];
  return {n, c, alta, pAlta:pct(alta, n), media:n ? vals.reduce((a, b) => a + b, 0) / n : null};
}
function textos(rows, qid){ return rows.map(r => String(r[qid] || '').trim()).filter(t => t.length > 1); }
function topN(rows, qid, k, excluir){ return distribuicao(rows, qid).itens.filter(i => i.n > 0 && !(excluir || []).includes(i.v)).sort((a, b) => b.n - a.n).slice(0, k); }

  const rows = []; const hoje = Date.now();

      funcao:peso([['acs', 9], ['enfermeiro', 3], ['tecnico_enf', 4], ['medico', 3], ['saude_bucal', 2], ['acolhimento', 2], ['gestao', 1], ['residente', 2]]),
      tempo:peso([['ate1', 6], ['1a5', 10], ['mais5', 9]]),

      d1_recebeu:recebeu,

function montaRoteiro(rows){
  const n = rows.length;
  const pares = calculaPares(rows).sort((a, b) => b.lacuna - a.lacuna);
  const maiorLacuna = pares[0];
  const agravos = topN(rows, 'v1_agravos', 4, ['nenhum', 'outro']);
  const grupos = topN(rows, 'v2_grupos', 3, ['outro']);
  const barreiras = topN(rows, 'v3_barreiras', 3, ['outro']);
  const materiais = topN(rows, 'r2_materiais', 3, ['outro']);
  const canais = topN(rows, 'r4_canais', 3, ['outro']);
  const linguagem = topN(rows, 'r3_linguagem', 2, ['outro']);
  const formato = topN(rows, 'r5_formato', 1);
  const naoFunciona = textos(rows, 'v7_nao_funciona').length;
  const semFluxo = distribuicao(rows, 'd4_fluxo'); const pSemFluxo = pct((semFluxo.itens.find(i => i.v === 'informal') || {n:0}).n + (semFluxo.itens.find(i => i.v === 'nao') || {n:0}).n, semFluxo.n);

  /* prioridade dos temas = % que escolheu + metade da lacuna (p.p.) do par ligado ao tema */
  const temas = distribuicao(rows, 'r1_temas').itens.map(t => {
    const ligados = Object.keys(LACUNA_TEMAS).filter(k => LACUNA_TEMAS[k].includes(t.v)).map(k => pares.find(p => p.id === k));
    const reforco = ligados.reduce((a, p) => Math.max(a, Math.max(0, p.lacuna)), 0);
    const parRef = ligados.sort((a, b) => b.lacuna - a.lacuna)[0];
    return Object.assign({}, t, {score:t.p + reforco / 2, reforco, parRef});
  }).filter(t => t.n > 0 || t.reforco >= 15).sort((a, b) => b.score - a.score).slice(0, 4);

  const upa = pares.find(p => p.id === 'ubs_upa');
  return {n, pares, maiorLacuna, agravos, grupos, barreiras, materiais, canais, linguagem, formato, naoFunciona, pSemFluxo, temas, upa};
}

  if (R.formato.length) linhas.push('- Formato preferido: ' + R.formato[0].t + ' (' + R.formato[0].p + '%)');
  return linhas.join('\n');
}

/* ---------------------- TELA: PAINEL ---------------------- */
function exportaCsv(rows){
  const cols = ['id_resposta', 'recebido_em', 'unidade', 'versao_form'];
  const esc = v => { const s = String(v == null ? '' : v); return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = cols.concat(QS.map(q => q.ordem + '. ' + q.curto));
  const linhas = rows.map(r => cols.map(c => r[c]).concat(QS.map(q => {
    const v = r[q.id];
    if (q.tipo === 'multipla') return v.map(x => optLabel(q.id, x)).join('; ') + (r[q.id + '_outro'] ? ' (outro: ' + r[q.id + '_outro'] + ')' : '');
    if (q.tipo === 'unica') return v ? optLabel(q.id, v) + (r[q.id + '_outro'] ? ' (' + r[q.id + '_outro'] + ')' : '') : '';
    return v == null ? '' : v;
  })));
  const csv = '﻿' + [head].concat(linhas).map(l => l.map(esc).join(';')).join('\r\n');
  const a = h('a', {href:URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'})), download:'escuta-el-nino-' + new Date().toISOString().slice(0, 10) + '.csv'});
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function linkFormulario(){
  const base = inAppsScript() ? (S.painel.urlApp || '') : location.origin + location.pathname;
  return base ? base + '?ubs=' + encodeURIComponent(S.unidade) : '';
}

    sel('funcao', 'funcao', 'Função'), sel('tempo', 'tempo', 'Tempo nesta UBS'),
    filtrado || f.unidade !== 'all' ? h('button', {class:'btn sm', onclick:() => { f.unidade = 'all'; f.funcao = 'all'; f.tempo = 'all'; render(true); }}, 'Limpar filtros') : null,
    h('p', {class:'note'}, 'Os filtros valem para tudo abaixo, inclusive o roteiro. Grupos com menos de ' + MIN_RECORTE + ' respostas ficam indisponíveis para preservar o anonimato.')));

  if (!all.length){ w.append(h('div', {class:'anon'}, h('b', null, 'Ainda não há respostas. '), 'Compartilhe o link do formulário com a equipe (botão “Copiar link do formulário”).')); out.append(h('img', {class:'skyline', src:IMG.skyline, alt:''})); return out; }
  if (filtrado && rows.length < MIN_RECORTE){ w.append(h('div', {class:'anon'}, h('b', null, 'Recorte oculto. '), 'Este filtro tem menos de ' + MIN_RECORTE + ' respostas e poderia identificar pessoas.')); return out; }

  /* KPIs */
  const e4 = likert(rows, 'e4_reconhecer'), v6 = likert(rows, 'v6_reconhecer_real');
  const d1 = distribuicao(rows, 'd1_recebeu');
  const recebeu = d1.itens.filter(i => i.v === 'treinamento' || i.v === 'material').reduce((a, i) => a + i.n, 0);
  const d3 = distribuicao(rows, 'd3_ajuda');
  const naoAdaptado = d1.itens.filter(i => i.v === 'nao' || i.v === 'nao_sei').reduce((a, i) => a + i.n, 0) + d3.itens.filter(i => i.v !== 'muito').reduce((a, i) => a + i.n, 0);
  const fl = distribuicao(rows, 'd4_fluxo'); const semFluxo = fl.itens.filter(i => i.v !== 'formal').reduce((a, i) => a + i.n, 0);
  const funcoes = topN(rows, 'funcao', 3);
  w.append(h('div', {class:'kpis'},
    h('div', {class:'stat'}, h('div', {class:'lbl'}, 'Respostas recebidas'), h('div', {class:'val'}, rows.length), h('div', {class:'sub no-present'}, funcoes.length ? 'Mais: ' + funcoes.map(x => minusc(curto(x.t)) + ' ' + x.n).join(' · ') : '')),
    h('div', {class:'stat'}, h('div', {class:'lbl'}, 'Sem orientação adaptada ao território'), h('div', {class:'val'}, pct(naoAdaptado, d1.n) + '%'), h('div', {class:'sub'}, 'não receberam nada ou dizem que o recebido ajuda só em parte ou pouco')),
    h('div', {class:'stat'}, h('div', {class:'lbl'}, 'Seguros para reconhecer agravos do calor'), h('div', {class:'val'}, e4.pAlta + '%'), h('div', {class:'sub'}, 'no caso concreto do território: ' + v6.pAlta + '%')),
    h('div', {class:'stat'}, h('div', {class:'lbl'}, 'Sem fluxo combinado para casos de calor'), h('div', {class:'val'}, pct(semFluxo, fl.n) + '%'), h('div', {class:'sub'}, 'informal, inexistente ou desconhecido'))));

  /* 1 ESCUTAR */
  w.append(h('section', {class:'sec', id:'s-escutar'}, secHead('1', 'Escutar', 'o que a equipe diz que conhece', 'Autoavaliação de familiaridade e segurança, de 1 (nada) a 5 (muito). É o ponto de partida declarado — a etapa 3 mostra o que muda no contexto da UBS.'),
    cardLikert(rows, ['e1_elnino', 'e2_calor_geral', 'e3_calor_ubs', 'e4_reconhecer', 'e5_orientar', 'e6_ubs_upa'], 'Familiaridade e segurança declaradas', 'Barras de 100%: vermelho = pouca segurança, cinza = mais ou menos, azul = muita segurança.')));

  /* 2 DIAGNOSTICAR */
  w.append(h('section', {class:'sec', id:'s-diagnosticar'}, secHead('2', 'Diagnosticar', 'o que já existe de material e fluxo', 'O que chegou até a equipe, se serve ao território e o que existe na rotina da unidade.'),
    h('div', {class:'grid2'},
      cardBarras(rows, 'd1_recebeu'), cardBarras(rows, 'd3_ajuda', {desc:'Só para quem recebeu material ou treinamento.'}),

      cardHalteres(rows),

      cardBarras(rows, 'v2_grupos', {destaque:3}), cardBarras(rows, 'v3_barreiras', {destaque:3}),
      cardTextos(rows, 'v7_nao_funciona', 'Orientações que não funcionam aqui'), cardTextos(rows, 'v8_caso', 'Situações reais relatadas'))));

  /* 4 DIRECIONAR */
  w.append(h('section', {class:'sec', id:'s-direcionar'}, secHead('4', 'Direcionar', 'o que vira workshop e material', 'O que a equipe pediu para o encontro e para os materiais finais.'),
    h('div', {class:'grid2'},

      cardTextos(rows, 'r6_pedido', 'Se pudesse pedir uma coisa ao workshop…'), cardBarras(rows, 'tempo', {titulo:'Tempo de atuação de quem respondeu', desc:'Perfil das respostas.'}))));

  /* ROTEIRO */
  w.append(h('section', {class:'sec', id:'s-roteiro'}, secHead('★', 'Roteiro do workshop', 'gerado pelas respostas', 'Sequência de cocriação pronta para levar ao encontro. Muda sozinha conforme chegam respostas ou quando você aplica filtros.'), blocoRoteiro(rows)));

/* ---------------------- TOOLTIP ---------------------- */
(function(){
  const tip = $('#tip');
  const show = (el, x, y) => {
    const raw = el.getAttribute('data-tip') || ''; const [v, ...rest] = raw.split('|');
    tip.replaceChildren(h('strong', null, v), rest.join('|'));
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    const px = Math.min(window.innerWidth - r.width - 8, Math.max(8, x - r.width / 2));
    const py = y - r.height - 12 < 8 ? y + 18 : y - r.height - 12;
    tip.style.left = px + 'px'; tip.style.top = py + 'px';
  };
  document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('pointerdown', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else tip.hidden = true; });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el){ const r = el.getBoundingClientRect(); show(el, r.left + r.width / 2, r.top); } });
  document.addEventListener('focusout', () => { tip.hidden = true; });
  window.addEventListener('scroll', () => { tip.hidden = true; }, {passive:true});
})();

/* ---------------------- RENDER E INÍCIO ---------------------- */
function render(manterScroll){
  const y = window.scrollY;
  const app = $('#app');
  let tela;
  if (S.view === 'form') tela = telaForm();
  else if (S.view === 'enviado') tela = telaEnviado();
  else if (S.view === 'login') tela = telaLogin();
  else if (S.view === 'painel') tela = telaPainel();
  else tela = telaInicio();
  app.replaceChildren(tela);
  document.title = (S.view === 'painel' || S.view === 'login' ? 'Painel do workshop' : 'Escuta da UBS') + ' · El Niño é pauta de saúde';
  if (manterScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
function rota(){
  if (location.hash === '#painel') irPainel();
  else if (S.view === 'painel' || S.view === 'login'){ S.view = 'inicio'; render(); }
}
async function iniciar(){
  lerUnidadeDaUrl();
  render();
  window.addEventListener('hashchange', rota);
  window.addEventListener('online', enviarPendentes);
  setInterval(() => { if (filaPendentes().length) enviarPendentes(); }, 30000);
  if (inAppsScript() && google.script.url) google.script.url.getLocation(loc => {
    const p = (loc && loc.parameter) || {};
    if (p.ubs){ S.unidade = String(p.ubs).slice(0, 120); S.unidadeFixa = true; }
    if (p.painel != null) irPainel(); else if (S.view === 'inicio') render();
  });
  if (location.hash === '#painel') irPainel();
  if (hasServer()){
    try{
      const ping = await api('ping');
      S.server = ping;
      if (!S.unidadeFixa && ping.ubs_padrao) S.unidade = ping.ubs_padrao;
      S.formAberto = ping.form_aberto !== false;
      if (ping.url_app) S.painel.urlApp = ping.url_app;
      if (S.view === 'inicio') render();
    }catch(e){ /* sem conexão: o formulário segue funcionando e guarda no aparelho */ }
    enviarPendentes();
  }
  if ('serviceWorker' in navigator && !inAppsScript() && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
iniciar();
